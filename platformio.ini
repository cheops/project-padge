; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:attiny85]
platform = atmelavr@5.2.0
board = attiny85
framework = arduino
build_flags =
    -flto
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
lib_deps =
    fastled/FastLED@^3.10.3
    adafruit/TinyWireM@^1.1.4
    felias-fogg/SoftI2CMaster@^2.1.3

; https://www.engbedded.com/fusecalc/
; https://eleccelerator.com/fusecalc/fusecalc.php?chip=attiny85
board_fuses.lfuse = 0xE2
board_fuses.hfuse = 0xDF
board_fuses.efuse = 0xFF

;upload_protocol = avrisp2

; use this with Arduino as ISP
upload_protocol = stk500v1

; each flag in a new line
upload_flags =
    -P$UPLOAD_PORT
    -b$UPLOAD_SPEED

; when programming with arduino pro mini 8MHz, you need to set the upload speed to 9600
upload_speed = 9600

; normal upload speed for AVRISP mkII
;upload_speed = 19200

; upload_port = COM15 
upload_port = /dev/ttyUSB0 

; use this with AVRISP mkII, USBasp, USBtinyISP, Arduino as ISP, etc.
;upload_port = usb 

